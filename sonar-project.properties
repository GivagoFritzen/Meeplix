# Identificação do Projeto
sonar.projectKey=Meeplix
sonar.projectName=Meeplix
sonar.projectVersion=1.0

# Conectividade com o servidor SonarQube
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Código-fonte analisado
sonar.sources=app,components,lib,middleware.ts

# Arquivos de teste
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx

# Exclusões
sonar.exclusions=node_modules/**,.next/**,coverage/**,preview/**,public/**,prisma/**,**/*.d.ts,next-env.d.ts
sonar.coverage.exclusions=tests/**,**/*.config.*,**/*.d.ts,next-env.d.ts

# Relatórios gerados pelo Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/sonar-test-report.xml

# tsconfig usado pelo analisador TypeScript (moduleResolution "bundler" não é
# suportado pelo eslint-bridge do SonarQube 9.9)
sonar.typescript.tsconfigPaths=tsconfig.sonar.json
