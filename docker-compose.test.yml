version: "3.8"

services:
  db-test:
    image: postgres:16-alpine
    container_name: meeplix-db-test
    environment:
      POSTGRES_USER: meeplix_test
      POSTGRES_PASSWORD: meeplix_test
      POSTGRES_DB: meeplix_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeplix_test -d meeplix_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - pgdata_test:/var/lib/postgresql/data

volumes:
  pgdata_test:
